aid: workrise
name: Workrise
description: Workrise - which returned to its original RigUp brand in September 2024 -
  is an Austin-based source-to-pay platform for the energy industry, combining vendor
  management, contingent workforce staffing, bid management, capital management, and
  field-service payments for upstream and midstream oil and gas operators. Backed by
  a16z and Founders Fund. The company publishes no public developer portal or API
  documentation; platform access is through accounts.rigup.com (OpenID Connect via
  Auth0), and its engineering org open-sources utilities at github.com/rigup.
